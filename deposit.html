<head>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body> <nav class="navbar navbar-expand-lg navbar-armada mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="menu.html">
                <i class="bi bi-shield-shaded me-2" style="color: var(--dorado-armada);"></i>Alke Wallet
            </a>
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" style="border-color: rgba(255,255,255,0.5);">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-uppercase align-items-lg-center" style="font-size: 0.9rem; font-weight: 500;">
                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="transactions.html">Movimientos</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link text-danger-emphasis" href="login.html"><i class="bi bi-box-arrow-right me-1"></i>Salir</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1">
        
        <header class="row mb-4">
            <div class="col-12">
                <h1 class="h3 mb-1 fw-bold text-uppercase">Cargar Fondos</h1>
                <p class="text-white-50 small mb-0">Abone saldo de manera inmediata a su billetera digital mediante canales seguros</p>
            </div>
        </header>

        <section class="row justify-content-center">
            <div class="col-12 col-md-8 col-lg-6">
                <div class="action-card p-4 shadow-lg">
                    <h3 class="h5 fw-bold mb-4 text-uppercase" style="color: var(--dorado-armada) !important;">Formulario de Abono</h3>
                    
                    <form id="formDeposit">
                        
                        <div class="mb-4">
                            <label for="sourceAccount" class="form-label fw-bold small text-uppercase">Medio de Pago / Origen</label>
                            <select id="sourceAccount" class="form-select bg-transparent border-secondary" required style="color: var(--texto-principal) !important; background-image: url(&#34;data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3e%3cpath fill='none' stroke='%2394a3b8' stroke-linecap='round' stroke-linejoin='round' stroke-width='2' d='m2 5 6 6 6-6'/%3e%3c/svg%3e&#34;);">
                                <option value="webpay" class="bg-dark text-white" selected>Webpay Plus (Tarjetas de Crédito/Débito)</option>
                                <option value="transferencia" class="bg-dark text-white">Transferencia Bancaria Electrónica</option>
                                <option value="servipag" class="bg-dark text-white">Servipag / Cuenta Vista</option>
                            </select>
                        </div>

                        <div class="mb-4">
                            <label for="amount" class="form-label fw-bold small text-uppercase">Monto a Cargar ($)</label>
                            <div class="input-group input-group-lg">
                                <span class="input-group-text bg-transparent border-secondary fw-bold" style="color: var(--texto-principal);">$</span>
                                <input type="number" id="amount" class="form-control bg-transparent border-secondary" placeholder="0" min="1" required style="color: var(--texto-principal) !important;">
                            </div>
                            <div class="form-text text-white-50 small mt-2">Los depósitos vía Webpay se procesan de forma inmediata en la bitácora.</div>
                        </div>

                        <div class="d-grid gap-2 pt-2">
                            <button type="submit" class="btn btn-success btn-lg rounded-3 fw-bold text-uppercase">
                                <i class="bi bi-wallet2 me-2"></i>Confirmar Depósito
                            </button>
                            <a href="menu.html" class="btn btn-outline-secondary rounded-3 text-uppercase small">Volver al Inicio</a>
                        </div>
                    </form>
                </div>
            </div>
        </section>

    </main>

    <footer class="page-footer text-center small text-muted mt-4">© 2026 Javier Leal V.</footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="datos.js"></script>
    <script src="app.js"></script>
    <script src="app.ext.js"></script>
</body>
</html>
