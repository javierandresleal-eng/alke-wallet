<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Iniciar Sesión</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="estilos.css">
</head>
<body class="login-page">

    <main class="container d-flex align-items-center justify-content-center min-vh-100">
        <div class="row justify-content-center w-100">
            <div class="col-12 col-md-8 col-lg-5 mx-auto">

                <section class="login-card text-center">

                    <div class="mb-4">
                        <h1 class="h3 fw-bold text-uppercase" style="color: var(--dorado-armada);">
                            Alke Wallet
                        </h1>
                    </div>

                    <h2 class="h5 mb-4 text-white-50">Ingreso al Sistema</h2>

                    <form id="formLogin" action="menu.html" method="GET" class="text-start">
                        
                        <div class="mb-3">
                            <label for="email" class="form-label text-white">Correo Electrónico</label>
                            <input type="email" class="form-control" id="email" placeholder="nombre@correo.com" required>
                            <div class="invalid-feedback">Por favor, ingrese un correo válido.</div>
                        </div>

                        <div class="mb-4">
                            <label for="password" class="form-label text-white">Contraseña</label>
                            <input type="password" class="form-control" id="password" placeholder="••••••••" required>
                            <div class="invalid-feedback">La contraseña es obligatoria.</div>
                        </div>

                        <button type="submit" class="btn btn-armada w-100 py-2 mb-3">
                            Login / Ingresar
                        </button>

                    </form>

                    <div class="mt-3 small">
                        <p class="mb-1 text-white-50">¿No tienes cuenta? <a href="#" class="link-dorado link-registrar">Regístrate aquí</a></p>
                        <a href="#" class="link-dorado">¿Olvidaste tu clave de acceso?</a>
                    </div>

                    <div id="registerSection" class="mt-4" style="display: none; text-align:left;">
                        <h3 class="h6 text-white mb-2">Registro</h3>
                        <form id="formRegister">
                            <div class="mb-2">
                                <label for="regEmail" class="form-label text-white small">Correo Electrónico</label>
                                <input type="email" id="regEmail" class="form-control form-control-sm" placeholder="nombre@correo.com" required>
                            </div>
                            <div class="mb-2">
                                <label for="regPassword" class="form-label text-white small">Contraseña</label>
                                <input type="password" id="regPassword" class="form-control form-control-sm" required>
                            </div>
                            <div class="mb-3">
                                <label for="regPassword2" class="form-label text-white small">Repetir Contraseña</label>
                                <input type="password" id="regPassword2" class="form-control form-control-sm" required>
                            </div>
                            <div class="d-flex gap-2">
                                <button class="btn btn-armada btn-sm" type="submit">Crear cuenta</button>
                                <button type="button" id="btnCancelRegister" class="btn btn-outline-secondary btn-sm">Cancelar</button>
                            </div>
                        </form>
                    </div>

                </section>

            </div>
        </div>
    </main>

    <footer class="page-footer text-center small text-muted mt-4">© 2026 Javier Leal V.</footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="datos.js"></script>
    <script src="app.js"></script>
    <script src="app.ext.js"></script>
</body>
</html>
