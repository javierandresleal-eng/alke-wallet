<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alke Wallet - Bitácora de Transacciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.2/font/bootstrap-icons.css">
    <link rel="stylesheet" href="estilos.css">
</head>
<body> <nav class="navbar navbar-expand-lg navbar-armada mb-4">
        <div class="container">
            <a class="navbar-brand fw-bold text-uppercase" href="menu.html">
                <i class="bi bi-shield-shaded me-2" style="color: var(--dorado-armada);"></i>Alke Wallet
            </a>
            <button class="navbar-toggler text-white" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation" style="border-color: rgba(255,255,255,0.5);">
                <span class="navbar-toggler-icon" style="filter: invert(1);"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto text-uppercase align-items-lg-center" style="font-size: 0.9rem; font-weight: 500;">
                    <li class="nav-item">
                        <a class="nav-link" href="menu.html">Inicio</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" aria-current="page" href="transactions.html">Movimientos</a>
                    </li>
                    
                    <li class="nav-item">
                        <a class="nav-link text-danger-emphasis" href="login.html"><i class="bi bi-box-arrow-right me-1"></i>Salir</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container flex-grow-1">
        
        <header class="row mb-4">
            <div class="col-12">
                <h1 class="h3 mb-1 fw-bold text-uppercase">Bitácora de Movimientos</h1>
                <p class="text-white-50 small mb-0">Historial financiero y auditoría de transacciones en línea</p>
            </div>
        </header>

        <section class="row g-3 mb-4 align-items-center">
            <div class="col-12 col-md-5">
                <div class="input-group">
                    <span class="input-group-text bg-transparent border-secondary text-white-50"><i class="bi bi-search"></i></span>
                    <input id="inputBuscarMovimiento" type="search" class="form-control bg-transparent border-secondary text-white" placeholder="Buscar por destinatario o detalle..." style="color: var(--texto-principal) !important;">
                </div>
            </div>
            
            <div class="col-12 col-md-7 text-md-end">
                <div class="btn-group w-100 w-md-auto" role="group" aria-label="Filtros de bitácora">
                    <button type="button" id="btnFiltroTodos" class="btn btn-outline-secondary px-3 active">Todos</button>
                    <button type="button" id="btnFiltroIngresos" class="btn btn-outline-success px-3">
                        <i class="bi bi-arrow-down-left me-1"></i>Ingresos
                    </button>
                    <button type="button" id="btnFiltroEgresos" class="btn btn-outline-danger px-3">
                        <i class="bi bi-arrow-up-right me-1"></i>Egresos
                    </button>
                    <button type="button" id="btnLimpiarPantalla" class="btn btn-outline-light px-3">
                        <i class="bi bi-x-circle me-1"></i>Limpiar
                    </button>
                </div>
            </div>
        </section>

        <section class="row">
            <div class="col-12">
                <div id="contenedorHistorial" class="action-card p-3">
                    <div id="listaMovimientosBitacora" class="list-group">
                        </div>
                </div>
            </div>
        </section>

    </main>

    <footer class="page-footer text-center small text-muted mt-4">© 2026 Javier Leal V.</footer>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <script src="datos.js"></script>
    <script src="app.js"></script>
    <script src="app.ext.js"></script>
</body>
</html>
